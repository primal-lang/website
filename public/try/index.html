<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Primal</title>
    <meta name="description"
        content="Write and run Primal code directly in your browser. Interactive playground with syntax highlighting, sample programs, and a built-in console." />
    <link rel="canonical" href="https://primal-lang.org/try/" />
    <meta property="og:site_name" content="Primal" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Playground - Primal" />
    <meta property="og:description"
        content="Write and run Primal code directly in your browser. Interactive playground with syntax highlighting, sample programs, and a built-in console." />
    <meta property="og:url" content="https://primal-lang.org/try/" />
    <meta property="og:image" content="https://primal-lang.org/img/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Primal - a declarative, functional programming language" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Playground - Primal" />
    <meta name="twitter:description"
        content="Write and run Primal code directly in your browser. Interactive playground with syntax highlighting, sample programs, and a built-in console." />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous" defer></script>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.css" integrity="sha384-zaeBlB/vwYsDRSlFajnDd7OydJ0cWk+c2OWybl3eSUf6hW2EbhlCsQPqKr3gkznT"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/theme/dracula.min.css" integrity="sha384-ccdJwIIg/K0Ab6aXF4MPACh7ckk61tvQFTrfkhXZEALgAETURNZIAuQLcS/aPbrM"
        crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.js" integrity="sha384-C7K/Pjo6rtJFtYWv792/hBOrCLhjcAa319ZhwjrDE8zCMEWglI7+S1CUEKD+q6uF"
        crossorigin="anonymous" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/javascript/javascript.min.js" integrity="sha384-g0o+WW9mdIxA7LaaCKTkRm0M5TVT+Bb4s9eocxPsI2G0Xm0POG9iD6G6qP1IIsfS"
        crossorigin="anonymous" defer></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap" rel="stylesheet">

    <!-- Material Symbols. Icons are ligatures, so display=block hides the raw
         glyph names ("upload_file") that swap would flash in the toolbar. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
        rel="stylesheet" />

    <link rel="icon" href="../img/icon.png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="../img/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a2c44" />
    <meta name="author" content="Primal" />

    <link rel="stylesheet" href="../css/template.css">
    <link rel="stylesheet" href="../css/highlight.css">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/split.js@1.6.5/dist/split.min.js" integrity="sha384-q2ksSc8z6Q4ZUnxlfZj9AXZLpSdWmD3q/YrId1twTeNHh56fNh98YbJSpppzGUvL"
        crossorigin="anonymous" defer></script>

    <script src="js/primal.js" defer></script>
    <script src="../js/highlight.js" defer></script>
    <script src="../js/feedback.js" defer></script>
    <script src="js/try.js" defer></script>

    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7BCHJ87ZG7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-7BCHJ87ZG7');
    </script>

</head>

<body>

    <noscript>
        <p class="noscript-note">The playground compiles and runs Primal in your browser, so it needs JavaScript
            enabled. The <a href="../start" class="custom-link">getting started guide</a> covers running Primal
            locally instead.</p>
    </noscript>

    <div class="layout">

        <nav class="navbar navbar-expand-lg navbar-container">
            <div class="container-fluid">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <button type="button" class="nav-link active" data-action="load"><span
                                class="material-symbols-outlined navbar-icon" aria-hidden="true">upload_file</span>
                            Load</button>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../reference" target="_blank" rel="noopener noreferrer"><span
                                class="material-symbols-outlined navbar-icon" aria-hidden="true">description</span>
                            Reference</a>
                    </li>
                    <li class="nav-item dropdown">
                        <button type="button" class="nav-link" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="material-symbols-outlined navbar-icon" aria-hidden="true">library_add</span>
                            Samples
                        </button>
                        <ul class="dropdown-menu">
                            <li><button type="button" class="dropdown-item" data-sample="balancedParentheses">Balanced
                                    Parentheses</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="binarySearch">Binary
                                    Search</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="divisors">Divisors</button>
                            </li>
                            <li><button type="button" class="dropdown-item" data-sample="factorial">Factorial</button>
                            </li>
                            <li><button type="button" class="dropdown-item" data-sample="fibonacci">Fibonacci</button>
                            </li>
                            <li><button type="button" class="dropdown-item" data-sample="findMax">Find Max</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="flatten">Flatten</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="frequency">Frequency</button>
                            </li>
                            <li><button type="button" class="dropdown-item" data-sample="gcdLcm">GCD &amp; LCM</button>
                            </li>
                            <li><button type="button" class="dropdown-item" data-sample="isPalindrome">Is
                                    palindrome</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="isPrime">Is prime</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="matrixMultiply">Matrix
                                    Multiply</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="movingAverages">Moving
                                    Averages</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="piEstimate">Pi
                                    Estimation</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="power">Power</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="quicksort">Quicksort</button>
                            </li>
                            <li><button type="button" class="dropdown-item" data-sample="reverseList">Reverse
                                    List</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="sumOfDigits">Sum of
                                    Digits</button></li>
                            <li><button type="button" class="dropdown-item" data-sample="toBinary">To Binary</button>
                            </li>
                            <li><button type="button" class="dropdown-item" data-sample="romanNumerals">To Roman
                                    Numerals</button></li>
                        </ul>
                    </li>
                </ul>

                <ul class="navbar-nav me-auto">
                    <li class="nav-item navbar-title">
                        v0.5.0 (Bronze Axe)
                    </li>
                </ul>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <button type="button" class="nav-link active" data-action="clear"><span
                                class="material-symbols-outlined navbar-icon" aria-hidden="true">mop</span>
                            Clear</button>
                    </li>
                    <li class="nav-item">
                        <button type="button" class="nav-link active" data-action="copy"><span
                                class="material-symbols-outlined navbar-icon" aria-hidden="true">content_copy</span>
                            Copy</button>
                    </li>
                    <li class="nav-item">
                        <button type="button" class="nav-link active" data-action="share"><span
                                class="material-symbols-outlined navbar-icon" aria-hidden="true">share</span>
                            Share</button>
                    </li>
                    <li class="nav-item">
                        <button type="button" class="nav-link active" data-action="feedback"><span
                                class="material-symbols-outlined navbar-icon" aria-hidden="true">comment</span>
                            Feedback</button>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="split content">
            <div id="split-0">
                <h1 class="visually-hidden">Primal playground</h1>
                <div id="sourceCode"></div>
            </div>
            <div id="split-1">
                <div id="output" class="console" role="log" aria-live="polite" aria-label="Program output"></div>
                <label class="visually-hidden" for="consoleInput">Evaluate an expression</label>
                <input id="consoleInput" type="text" class="console-input" placeholder=">" autocomplete="off"
                    autocapitalize="off" spellcheck="false" />
            </div>
        </div>

    </div>
    <input class="form-control" type="file" id="loadFile" accept=".prm,text/plain" hidden>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastOutputCleared" class="toast align-items-center" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">Output cleared</div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>

        <div id="toastTextCopied" class="toast align-items-center" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">Source code copied to clipboard</div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>

        <div id="toastUrlCopied" class="toast align-items-center" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">URL copied to clipboard</div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>

        <div id="toastCopyFailed" class="toast align-items-center" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">Nothing copied. Your browser blocked access to the clipboard.</div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>

        <div id="toastFeedbackSent" class="toast align-items-center" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">Feedback sent</div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>

        <div id="toastFeedbackFailed" class="toast align-items-center" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">Feedback not sent. Check your connection and try again.</div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="feedbackModal" tabindex="-1" role="dialog"
        aria-labelledby="feedbackModalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h6" id="feedbackModalTitle">Feedback</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="visually-hidden" for="feedbackText">Your feedback</label>
                    <textarea class="form-control" id="feedbackText" rows="5" required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="sendFeedbackButton"
                        data-action="send-feedback" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
